server:
  port: 8080
spring:
  application:
    name: chat-with-redis
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/chatdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:chatuser}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-this-32-bytes-minimum}
    expiration-ms: 86400000
